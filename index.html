<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Service Status</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fa; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; max-width: 400px; }
        h1 { color: #10b981; margin-bottom: 10px; font-size: 24px; }
        p { color: #6b7280; font-size: 14px; line-height: 1.5; }
        .badge { display: inline-block; background: #ecfdf5; color: #059669; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>陣列節點服務運行中</h1>
        <p>當前邊緣計算網絡（Edge Computing Node）已成功與中央叢集對接，正在提供靜態負載均衡與數據路由服務。</p>
        <div class="badge">STATUS: HEALTHY</div>
    </div>
</body>
</html>
